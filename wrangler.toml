# Cloudflare Pages 設定（D1 schema 用 migrations/ 管理）
# 本 repo 不含任何真實 ID；部署時請於 Cloudflare 後台建立資源後填入對應 database_id / account_id。
# 此 PR 僅定義程式碼，不執行部署。
name = "universal-lesson-generator"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "universal-lesson-generator"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "WIKI_BUCKET"
bucket_name = "universal-lesson-generator-wiki"

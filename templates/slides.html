<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  簡報母版 v2（templates/slides.html，Job w10-poc-004）
  Agent 只產出簡報結構 JSON；組裝時把 JSON 注入 <script id="deck-data">，不改母版。
  風格參照（內建，並顯示在簡報最後一頁）：
    - 圖示：Lucide Icons v1.76.0，ISC License — https://lucide.dev ／ https://github.com/lucide-icons/lucide
      （下方 ICONS 內嵌的是 lucide-static 原始 SVG 路徑，未修改，只用 currentColor 換色）
    - 配色：Okabe–Ito 色盲友善配色（Color Universal Design，Okabe & Ito 2008）— https://jfly.uni-koeln.de/color/
      #0072B2 藍＝固定自動流｜#D55E00 朱＝單一 Agent｜#009E73 綠＝Multi-Agent｜#E69F00 橙＝強調／時間
    - 字型：Noto Sans TC，SIL Open Font License 1.1 — https://fonts.google.com/noto/specimen/Noto+Sans+TC
  版面規則：specs/style.md（v2 依 PM 釐清：每頁重點比 v1 多；內文 ≥ 22px、標題 ≥ 40px；每頁標段落與分鐘）
-->
<style>
  :root{
    --wf:#0072B2; --ag:#D55E00; --ma:#009E73; --acc:#E69F00; --sky:#56B4E9;
    --bg:#FAF7F0; --ink:#1B2433; --muted:#566074; --line:#E3DCCD; --card:#FFFFFF;
    --wf-l:#E3F0F8; --ag-l:#FBEADF; --ma-l:#DFF3EC; --acc-l:#FCF1D9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#222834;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{position:absolute;width:1280px;height:720px;background:var(--bg);border-radius:6px;overflow:hidden;
    display:none;flex-direction:column;padding:0 64px;transform-origin:center center}
  .slide.on{display:flex}
  svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  /* 上方：段落時間軸＋本頁時間 */
  .top{display:flex;align-items:center;gap:14px;height:62px;flex:none}
  .tl{display:flex;gap:6px;flex:1}
  .tl span{height:8px;border-radius:4px;background:#E6DFD0}
  .tl span.done{background:#C9BFA9}
  .tl span.cur{background:var(--acc)}
  .badge{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:#7A4E00;background:var(--acc-l);
    border:2px solid var(--acc);border-radius:999px;padding:4px 16px;white-space:nowrap}
  .badge svg{font-size:22px;color:var(--acc)}
  .story{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;font-size:21px;font-weight:500;color:#8A3B00;
    background:var(--ag-l);border-radius:999px;padding:6px 20px;margin:4px 0 12px;max-width:100%}
  .story svg{font-size:24px;color:var(--ag)}
  h1{font-size:42px;font-weight:900;line-height:1.2;margin-bottom:16px}
  .t-cover h1{font-size:58px;margin:10px 0 22px}
  .body{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .ref{font-size:16px;color:var(--muted);font-weight:500;white-space:nowrap;letter-spacing:.3px}
  ul.pts{list-style:none;display:flex;flex-direction:column;gap:10px}
  ul.pts li{font-size:24px;line-height:1.45;padding-left:28px;position:relative}
  ul.pts li::before{content:"";position:absolute;left:4px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--acc))}
  .row{display:flex;gap:22px;min-height:0}
  .card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
  .card .hd{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900;color:var(--c)}
  .card .hd svg{font-size:36px}
  .card .tx{font-size:24px;line-height:1.45}
  .wf{--c:var(--wf);--l:var(--wf-l)} .ag{--c:var(--ag);--l:var(--ag-l)} .ma{--c:var(--ma);--l:var(--ma-l)} .acc{--c:var(--acc);--l:var(--acc-l)}
  .card.wf,.card.ag,.card.ma{border-top:6px solid var(--c)}
  .note{font-size:20px;color:var(--muted);line-height:1.45}
  .callout{font-size:22px;font-weight:700;line-height:1.45;padding:12px 20px;border-left:8px solid var(--acc);background:#fff;border-radius:0 10px 10px 0}
  /* cover */
  .cover-wrap{display:flex;gap:40px;flex:1}
  .cover-wrap ul.pts li{font-size:25px}
  .cover-icons{display:flex;flex-direction:column;justify-content:center;gap:18px;width:250px}
  .cover-icons div{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;color:var(--c)}
  .cover-icons svg{font-size:56px}
  /* agenda */
  .agenda{display:flex;flex-direction:column;gap:5px}
  .ag-row{display:grid;grid-template-columns:44px 1fr 200px 100px;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:3px 16px}
  .ag-row svg{font-size:32px;color:var(--c)}
  .ag-row .nm{font-size:23px;font-weight:700}
  .ag-row .rg{font-size:18px;color:var(--muted);white-space:nowrap}
  .ag-row .mn{font-size:22px;font-weight:900;color:#7A4E00;text-align:right}
  .bar{height:8px;border-radius:4px;background:var(--c);margin-top:3px}
  /* table */
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:23px;background:#fff;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
  th{font-size:19px;text-align:left;color:#fff;background:var(--ink);font-weight:700;padding:9px 14px}
  td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}
  tr.wf td:first-child,tr.ag td:first-child,tr.ma td:first-child{border-left:8px solid var(--c);font-weight:700;color:var(--c)}
  td:first-child{font-weight:700}
  /* patterns */
  .pat{display:grid;gap:16px;flex:1;min-height:0}
  .pcard{background:#fff;border:2px solid var(--line);border-top:6px solid var(--wf);border-radius:14px;padding:12px 18px;display:flex;flex-direction:column;gap:7px}
  .pcard .hd{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900;color:var(--wf)}
  .pcard .hd svg{font-size:32px} .pcard .hd em{margin-left:auto;font-style:normal;font-size:17px;color:#7A4E00;background:var(--acc-l);border-radius:999px;padding:2px 10px}
  .pcard .how{font-size:22px;line-height:1.42}
  .pcard .ex{font-size:19px;line-height:1.42;color:#244}
  .pcard .fair{font-size:19px;line-height:1.4;color:#8A3B00;background:var(--ag-l);border-radius:8px;padding:4px 10px}
  .warns{display:flex;flex-direction:column;gap:6px}
  .warns div{font-size:19px;line-height:1.4;background:#fff;border-left:6px solid var(--acc);padding:6px 14px;border-radius:0 8px 8px 0}
  /* steps */
  .steps{display:flex;gap:30px;flex:1;min-height:0}
  ol.st{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px;flex:1}
  ol.st li{counter-increment:s;font-size:23px;line-height:1.45;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 16px 10px 64px;position:relative}
  ol.st li::before{content:counter(s);position:absolute;left:14px;top:9px;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:21px;display:flex;align-items:center;justify-content:center}
  .diagram{width:330px;flex:none;display:flex;align-items:center;justify-content:center}
  .diagram svg{width:320px;height:auto}
  /* split */
  .split{display:flex;gap:22px;flex:1;min-height:0}
  .split .card ul.pts li{font-size:23px}
  .split .card ul.pts{gap:14px}
  /* myths */
  .myths{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .myth{background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px 24px;cursor:pointer;min-height:150px}
  .myth .m{display:flex;gap:10px;align-items:center;font-size:26px;font-weight:700;flex-wrap:wrap}
  .myth .m svg{font-size:28px;color:var(--ag)}
  .myth .f{display:flex;gap:10px;align-items:flex-start;font-size:24px;line-height:1.4;margin-top:8px;color:#06523C;visibility:hidden}
  .myth .f svg{font-size:26px;color:var(--ma)}
  .myth.open .f{visibility:visible}
  .hint{font-size:16px;color:var(--muted);font-weight:500}
  .myth.open .hint,.quiz li.open .hint{display:none}
  /* quiz */
  ol.quiz{list-style:none;display:flex;flex-direction:column;gap:10px}
  .quiz li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 22px;cursor:pointer}
  .quiz .q{font-size:24px;font-weight:700;line-height:1.42}
  .quiz .a{font-size:23px;margin-top:6px;color:#06523C;font-weight:700;visibility:hidden}
  .quiz li.open .a{visibility:visible}
  /* sources */
  .srcgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;flex:1;min-height:0}
  .srcs{list-style:none;display:flex;flex-direction:column;gap:9px}
  .srcs li{font-size:20px;line-height:1.35}
  .srcs b{color:var(--ag);margin-right:6px}
  .srcs a{display:block;color:var(--muted);font-size:15px;word-break:break-all}
  footer{display:flex;justify-content:space-between;align-items:center;height:46px;margin:12px -64px 0;padding:0 64px;
    font-size:16px;color:var(--muted);border-top:1px solid var(--line);flex:none}
  #nav{position:fixed;top:10px;right:14px;opacity:.6;display:flex;gap:8px;z-index:9}
  #nav button{font:inherit;font-size:16px;padding:6px 14px;border-radius:8px;border:0;background:#ffffffcc;cursor:pointer}
  #bar{position:fixed;left:0;top:0;height:4px;background:var(--acc);z-index:9;transition:width .2s}
  @media print{#nav,#bar{display:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="上一頁">◀</button><button id="next" aria-label="下一頁">▶</button></div>
<script id="deck-data" type="application/json">{{DECK_JSON}}</script>
<script>
(function(){
  const deck = JSON.parse(document.getElementById('deck-data').textContent);
  // Lucide Icons v1.76.0（ISC License, https://lucide.dev）原始 SVG 內容
  const LUCIDE = {"book-open": "<path d=\"M12 5v16\" /> <path d=\"M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z\" />", "brain": "<path d=\"M12 18V5\" /> <path d=\"M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4\" /> <path d=\"M17.707 6.294A3 3 0 1012 5a3 3 0 10-5.707 1.294\" /> <path d=\"M17.996 5.125a4 4 0 012.526 5.77\" /> <path d=\"M18 18a4 4 0 002-7.465\" /> <path d=\"M19.967 17.482a4 4 0 11-7.967.517 4 4 0 11-7.967-.517\" /> <path d=\"M6 18a4 4 0 01-2-7.465\" /> <path d=\"M6.004 5.125a4 4 0 00-2.526 5.77\" />", "circle-check": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"m16 9-5.5 5.5L8 12\" />", "circle-help": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"M9 9.5a3 2.5 0 016 0c0 2-2 2-3 3.5\" /> <path d=\"M12 17h.01\" />", "circle-x": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"m15 9-6 6\" /> <path d=\"m9 9 6 6\" />", "file-text": "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\" /> <path d=\"M14 2v5a1 1 0 0 0 1 1h5\" /> <path d=\"M10 9H8\" /> <path d=\"M16 13H8\" /> <path d=\"M16 17H8\" />", "gauge": "<path d=\"m12 14 4-4\" /> <path d=\"M3.34 19a10 10 0 1 1 17.32 0\" />", "layers": "<path d=\"M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z\" /> <path d=\"M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12\" /> <path d=\"M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17\" />", "list-checks": "<path d=\"M13 5h8\" /> <path d=\"M13 12h8\" /> <path d=\"M13 19h8\" /> <path d=\"m3 17 2 2 4-4\" /> <path d=\"m3 7 2 2 4-4\" />", "list-ordered": "<path d=\"M11 5h10\" /> <path d=\"M11 12h10\" /> <path d=\"M11 19h10\" /> <path d=\"M4 4h1v5\" /> <path d=\"M4 9h2\" /> <path d=\"M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02\" />", "network": "<rect x=\"16\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\" /> <rect x=\"2\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\" /> <rect x=\"9\" y=\"2\" width=\"6\" height=\"6\" rx=\"1\" /> <path d=\"M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3\" /> <path d=\"M12 12V8\" />", "repeat": "<path d=\"m17 2 4 4-4 4\" /> <path d=\"M3 11v-1a4 4 0 0 1 4-4h14\" /> <path d=\"m7 22-4-4 4-4\" /> <path d=\"M21 13v1a4 4 0 0 1-4 4H3\" />", "route": "<path d=\"M9 5h8.5a1 1 0 010 7h-11a1 1 0 000 7H15\" /> <circle cx=\"18\" cy=\"19\" r=\"3\" /> <circle cx=\"6\" cy=\"5\" r=\"3\" />", "scale": "<path d=\"M12 3v18\" /> <path d=\"m19 8 3 8a5 5 0 0 1-6 0zV7\" /> <path d=\"M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1\" /> <path d=\"m5 8 3 8a5 5 0 0 1-6 0zV7\" /> <path d=\"M7 21h10\" />", "sparkles": "<path d=\"M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z\" /> <path d=\"M20 2v4\" /> <path d=\"M22 4h-4\" /> <circle cx=\"4\" cy=\"20\" r=\"2\" />", "split": "<path d=\"M16 3h5v5\" /> <path d=\"M8 3H3v5\" /> <path d=\"M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3\" /> <path d=\"m15 9 6-6\" />", "tent": "<path d=\"M3.5 21 14 3\" /> <path d=\"M20.5 21 10 3\" /> <path d=\"M15.5 21 12 15l-3.5 6\" /> <path d=\"M2 21h20\" />", "timer": "<line x1=\"10\" x2=\"14\" y1=\"2\" y2=\"2\" /> <line x1=\"12\" x2=\"15\" y1=\"14\" y2=\"11\" /> <circle cx=\"12\" cy=\"14\" r=\"8\" />", "triangle-alert": "<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\" /> <path d=\"M12 9v4\" /> <path d=\"M12 17h.01\" />", "user-cog": "<path d=\"M10 15H6a4 4 0 0 0-4 4v2\" /> <path d=\"m14.305 16.53.923-.382\" /> <path d=\"m15.228 13.852-.923-.383\" /> <path d=\"m16.852 12.228-.383-.923\" /> <path d=\"m16.852 17.772-.383.924\" /> <path d=\"m19.148 12.228.383-.923\" /> <path d=\"m19.53 18.696-.382-.924\" /> <path d=\"m20.772 13.852.924-.383\" /> <path d=\"m20.772 16.148.924.383\" /> <circle cx=\"18\" cy=\"15\" r=\"3\" /> <circle cx=\"9\" cy=\"7\" r=\"4\" />", "workflow": "<rect width=\"8\" height=\"8\" x=\"3\" y=\"3\" rx=\"2\" /> <path d=\"M7 11v4a2 2 0 0 0 2 2h4\" /> <rect width=\"8\" height=\"8\" x=\"13\" y=\"13\" rx=\"2\" />", "wrench": "<path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z\" />"};
  const ic = (n, cls) => LUCIDE[n] ? `<svg class="i ${cls||''}" viewBox="0 0 24 24" aria-hidden="true">${LUCIDE[n]}</svg>` : '';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pt = s => esc(s).replace(/\s*((?:\[[A-E]\])+)/g, ' <span class="ref">$1</span>');
  const refTxt = r => (r && r.length) ? r.map(x => '[' + x + ']').join('') : '';
  const SECS = [2,4,6,6,5,4,3];
  const DIAG = {
    loop: `<svg viewBox="0 0 320 300" aria-label="Agent 工具迴圈">
      <rect x="95" y="20" width="130" height="64" rx="14" fill="var(--ag)"/><text x="160" y="60" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">AI（想）</text>
      <rect x="95" y="196" width="130" height="64" rx="14" fill="var(--wf)"/><text x="160" y="236" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">工具（做）</text>
      <path d="M95,60 C30,90 30,200 95,228" fill="none" stroke="var(--wf)" stroke-width="5"/><polygon points="88,214 104,232 82,238" fill="var(--wf)"/>
      <path d="M225,228 C290,200 290,90 225,60" fill="none" stroke="var(--ag)" stroke-width="5"/><polygon points="232,74 216,56 238,50" fill="var(--ag)"/>

      <text x="160" y="290" text-anchor="middle" font-size="16" fill="var(--muted)">圖意依 [E] 的 agent 圖</text></svg>`,

      <path d="M300,300 L300,40" stroke="var(--acc)" stroke-width="5"/><polygon points="288,48 300,22 312,48" fill="var(--acc)"/>
      <text x="300" y="14" font-size="16" fill="var(--muted)" text-anchor="end">往上＝更彈性、更貴</text></svg>`
  };
  const stage = document.getElementById('stage');
  const N = deck.slides.length;
  deck.slides.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide t-' + s.type;
    const tl = SECS.map((m, k) => `<span style="flex:${m}" class="${s.sec ? (k + 1 < s.sec ? 'done' : (k + 1 === s.sec ? 'cur' : '')) : 'done'}"></span>`).join('');

        <div class="callout">${pt(s.question)}</div>`;
    } else if (s.type === 'agenda') {
      h += `<div class="agenda">${s.items.map((it, k) => `<div class="ag-row ${['acc','acc','wf','ag','ma','acc','acc'][k]}">${ic(it.icon)}<div><div class="nm">${k + 1}. ${esc(it.name)}</div><div class="bar" style="width:${it.min / 6 * 100}%"></div></div><div class="rg">${esc(it.range)} 分｜Wiki ${esc(it.wiki)}</div><div class="mn">${it.min} 分鐘</div></div>`).join('')}</div><p class="note">${esc(s.note)}</p>`;
    } else if (s.type === 'cards') {
      h += `<div class="row">${s.cards.map(c => `<div class="card ${c.c}"><div class="hd">${ic(c.icon)}${esc(c.title)}</div><div class="tx">${pt(c.text)}</div></div>`).join('')}</div>`;
      if (s.extra) h += `<ul class="pts">${s.extra.map(p => `<li>${pt(p)}</li>`).join('')}</ul>`;
    } else if (s.type === 'table') {
      h += `<table><tr>${s.head.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${s.rows.map((r, k) => `<tr class="${(s.rowc || [])[k] || ''}">${r.map(c => `<td>${pt(c)}</td>`).join('')}</tr>`).join('')}</table>`;
      if (s.extra) h += `<ul class="pts">${s.extra.map(p => `<li>${pt(p)}</li>`).join('')}</ul>`;
      if (s.takeaway) h += `<div class="callout">${pt(s.takeaway)}</div>`;
    } else if (s.type === 'patterns') {
      if (s.lead) h += `<div class="callout" style="font-size:20px">${pt(s.lead)}</div>`;
      h += `<div class="pat" style="grid-template-columns:repeat(${s.items.length},1fr)">${s.items.map(p => `<div class="pcard"><div class="hd">${ic(p.icon)}${esc(p.name)}<em>${esc(p.min)}</em></div><div class="how">${pt(p.how)}</div><div class="ex">${pt(p.ex)}</div><div class="fair">${pt(p.fair)}</div></div>`).join('')}</div>`;
      if (s.warn) h += `<div class="warns">${s.warn.map(w => `<div>${pt(w)}</div>`).join('')}</div>`;
    } else if (s.type === 'steps') {
      const c = s.diagram === 'loop' ? 'ag' : 'acc';
      h += `<div class="steps"><ol class="st ${c}">${s.steps.map(x => `<li>${pt(x)}</li>`).join('')}</ol><div class="diagram">${DIAG[s.diagram] || ''}</div></div>`;
      if (s.note) h += `<p class="note">${pt(s.note)}</p>`;
    } else if (s.type === 'split') {
      h += `<div class="split">${s.cols.map(c => `<div class="card ${c.c}"><div class="hd">${ic(c.icon)}${esc(c.h)}</div><ul class="pts">${c.pts.map(p => `<li>${pt(p)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    } else if (s.type === 'myths') {
      h += `<div class="myths">${s.myths.map(m => `<div class="myth" tabindex="0"><div class="m">${ic('circle-x')}「${esc(m.myth)}」<span class="hint">（點我看答案）</span></div><div class="f">${ic('circle-check')}<span>${esc(m.fact)} <span class="ref">${refTxt(m.refs)}</span></span></div></div>`).join('')}</div>`;
    } else if (s.type === 'quiz') {
      h += `<ol class="quiz">${s.questions.map((q, k) => `<li tabindex="0"><div class="q">${k + 1}. ${esc(q.q)} <span class="hint">（點我看答案）</span></div><div class="a">答：${esc(q.a)} <span class="ref">${refTxt(q.refs)}</span></div></li>`).join('')}</ol>`;
      if (s.takeaway) h += `<div class="callout">${pt(s.takeaway)}</div>`;
    } else if (s.type === 'sources') {
      h += `<div class="srcgrid"><div class="card"><div class="hd" style="color:var(--ag)">${ic('file-text')}內容來源（Wiki [A]–[E]）</div><ul class="srcs">${deck.sources.map(x => `<li><b>[${x.id}]</b>${esc(x.title)}<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></li>`).join('')}</ul></div>
        <div class="card"><div class="hd" style="color:var(--wf)">${ic('sparkles')}風格參照（外部開源／公開方案）</div><ul class="srcs">${deck.style_refs.map(x => `<li><b style="color:var(--wf)">${esc(x.what)}</b>${esc(x.name)}<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a><span class="note" style="font-size:15px">${esc(x.note)}</span></li>`).join('')}</ul></div></div>`;
    }
    h += `</div><footer><span>${s.type === 'sources' ? '完整來源＋風格參照' : '本頁來源：' + (refTxt(s.refs) || '—（課程地圖，無內容主張）')}</span><span>${esc(deck.title)}｜${i + 1} / ${N}</span></footer>`;
    el.innerHTML = h;
    stage.appendChild(el);
  });
  stage.querySelectorAll('.quiz li,.myth').forEach(li => li.addEventListener('click', e => { e.stopPropagation(); li.classList.toggle('open'); }));
  const slides = [...stage.children];
  let cur = Math.min(Math.max(parseInt(location.hash.slice(1)) - 1 || 0, 0), N - 1);
  function fit(){ const k = Math.min(innerWidth / 1280, innerHeight / 720) * 0.96; slides.forEach(s => s.style.transform = `scale(${k})`); }
  function show(n){ cur = Math.min(Math.max(n, 0), N - 1); slides.forEach((s, i) => s.classList.toggle('on', i === cur));
    document.getElementById('bar').style.width = ((cur + 1) / N * 100) + '%'; history.replaceState(null, '', '#' + (cur + 1)); }
  addEventListener('resize', fit);
  addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1)) - 1; if (n !== cur && !isNaN(n)) show(n); });
  addEventListener('keydown', e => { if (['ArrowRight','PageDown',' '].includes(e.key)) show(cur + 1); if (['ArrowLeft','PageUp'].includes(e.key)) show(cur - 1); });
  document.getElementById('next').onclick = () => show(cur + 1);
  document.getElementById('prev').onclick = () => show(cur - 1);
  fit(); show(cur);
})();
</script>
</body>
</html>

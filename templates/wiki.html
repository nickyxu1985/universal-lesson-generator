<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM-Wiki｜自動流程選型（固定自動流 → 單一 Agent → Multi-Agent）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  Wiki 瀏覽頁母版（templates/wiki.html）
  內容由 scripts/build_wiki.py 從 wiki/*.md 轉出後注入 <script id="wiki-data">，母版不放任何 Wiki 文字。
  配色與字型沿用簡報母版 templates/slides.html。
-->
<style>
  :root{
    --bg:#FBF6EC; --ink:#1F2A44; --muted:#5B6478; --line:#E4DACA;
    --accent:#E0662F; --accent-soft:#FDE8DC; --line-c:#2F7DD1; --branch-c:#2E9E6A;
    --card:#FFFFFF; --side:#1F2A44;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:17px;line-height:1.75;display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
  aside{background:var(--side);color:#E9ECF3;position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 18px;display:flex;flex-direction:column;gap:6px}
  .brand{padding:0 10px 18px;border-bottom:1px solid #ffffff22;margin-bottom:12px}
  .brand .k{font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:700}
  .brand .t{font-size:20px;font-weight:900;line-height:1.35;margin-top:4px}
  .brand .s{font-size:13px;color:#AEB6C8;margin-top:6px;line-height:1.5}
  nav a{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;color:#D5DAE5;text-decoration:none;font-size:15.5px;line-height:1.45}
  nav a .n{font-weight:900;color:#8E98AE;font-size:14px;min-width:22px}
  nav a:hover{background:#ffffff12;color:#fff}
  nav a.on{background:var(--accent);color:#fff}
  nav a.on .n{color:#fff}
  .sep{height:1px;background:#ffffff22;margin:12px 6px}
  .side-foot{margin-top:auto;font-size:12.5px;color:#8E98AE;padding:16px 10px 0;line-height:1.6}
  .side-foot a{color:#AEB6C8}
  main{padding:48px clamp(20px,5vw,72px) 80px;max-width:920px;width:100%}
  .crumb{font-size:13.5px;color:var(--muted);margin-bottom:10px}
  .crumb a{color:var(--muted)}
  article h1{font-size:34px;font-weight:900;line-height:1.3;margin-bottom:22px;padding-bottom:16px;border-bottom:3px solid var(--ink)}
  article h2{font-size:23px;font-weight:900;margin:34px 0 12px;padding-left:12px;border-left:6px solid var(--accent)}
  article h3{font-size:19px;font-weight:700;margin:24px 0 8px}
  article p{margin:10px 0}
  article ul,article ol{margin:8px 0 8px 1.4em}
  article li{margin:6px 0}
  article li ul{margin-top:4px}
  article strong{font-weight:900}
  article blockquote{background:var(--accent-soft);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 18px;margin:0 0 18px;font-size:15.5px;color:#5a3a26}
  article code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:#EFE6D6;border-radius:5px;padding:1px 6px}
  article pre{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;overflow-x:auto;margin:12px 0}
  article pre code{background:none;padding:0;font-size:14px;line-height:1.6}
  article a{color:var(--line-c);word-break:break-all}
  .tbl{overflow-x:auto;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:15.5px}
  th{text-align:left;font-weight:700;color:var(--muted);padding:10px 14px;border-bottom:2px solid var(--ink);white-space:nowrap}
  td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
  tr:last-child td{border-bottom:0}
  a.tag{display:inline-block;font-size:12.5px;font-weight:700;line-height:1;padding:4px 6px;margin:0 1px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent);text-decoration:none;vertical-align:2px;word-break:normal;cursor:pointer}
  a.tag:hover{background:var(--accent);color:#fff}
  h2.srchead + ul, h2.srchead + ol{list-style:none;margin-left:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 18px}
  h2.srchead + ul li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:15.5px}
  h2.srchead + ul li:last-child{border-bottom:0}
  li.hit{background:#FFF3C4;border-radius:6px;transition:background .3s}
  .pager{display:flex;justify-content:space-between;gap:14px;margin-top:48px;padding-top:22px;border-top:1px solid var(--line)}
  .pager a{flex:1;max-width:48%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;line-height:1.45}
  .pager a small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
  .pager a.next{text-align:right;margin-left:auto}
  .pager a:hover{border-color:var(--accent)}
  .src-file{margin-top:20px;font-size:13px;color:var(--muted)}
  .src-file a{color:var(--muted)}
  #menu{display:none}
  @media (max-width:820px){
    body{display:block}
    aside{position:sticky;top:0;height:auto;z-index:5;padding:12px 14px;gap:0}
    .brand{padding:0;border:0;margin:0;display:flex;justify-content:space-between;align-items:center}
    .brand .k,.brand .s{display:none}
    .brand .t{font-size:16px;margin:0}
    #menu{display:block;font:inherit;font-size:14px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
    aside nav,aside .sep,aside .side-foot{display:none}
    aside.open nav{display:block;margin-top:10px}
    aside.open .sep{display:block}
    main{padding:24px 18px 60px}
    article h1{font-size:26px}
  }
</style>
</head>
<body>
<aside id="side">
  <div class="brand">
    <div>
      <div class="k">LLM-WIKI</div>
      <div class="t">自動流程選型</div>
      <div class="s">固定自動流 → 單一 Agent → Multi-Agent<br>主張後的 [A]–[E] 可點，跳到該頁來源</div>
    </div>
    <button id="menu" aria-label="開啟目錄">目錄</button>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">內容：<span id="foot-path"></span>（Instinct 驗收 PASS，Job w10-poc-001）<br>本頁只做呈現，不改 Wiki 內容。</div>
</aside>
<main>
  <div class="crumb" id="crumb"></div>
  <article id="doc"></article>
  <div class="pager" id="pager"></div>
</main>
<script id="wiki-data" type="application/json">{{WIKI_JSON}}</script>
<script>
(function(){
  const W = JSON.parse(document.getElementById('wiki-data').textContent);
  const P = W.pages, wikiPages = P.filter(p => p.id !== 'about');
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const short = t => t.replace(/^\d\d\s*/, '').replace(/[（(].*$/, '').split('：')[0];
  $('foot-path').textContent = 'wiki/' + W.slug + '/';

  // 從各頁「來源」清單收集 [A]–[E] 標題，做 tag 的滑鼠提示
  const SRC = {};
  const tmp = document.createElement('div');
  P.forEach(p => { tmp.innerHTML = p.html; tmp.querySelectorAll('h2.srchead + ul > li').forEach(li => {
    const m = li.textContent.match(/^\[([A-E])\]\s*(.*?)：\s*https?:/); if (m && !SRC[m[1]]) SRC[m[1]] = m[2]; }); });

  $('nav').innerHTML = wikiPages.map(p => `<a href="#${p.id}" data-id="${p.id}"><span class="n">${p.id}</span><span>${esc(short(p.title))}</span></a>`).join('')
    + '<div class="sep"></div>' + P.filter(p => p.id === 'about').map(p => `<a href="#about" data-id="about"><span class="n">ⓘ</span><span>${esc(p.title)}</span></a>`).join('');

  function show(id){
    const i = P.findIndex(p => p.id === id); const p = P[i >= 0 ? i : 0];
    const doc = $('doc'); doc.innerHTML = p.html;
    if (p.id === 'about' && !doc.querySelector('h1')) doc.insertAdjacentHTML('afterbegin', `<h1>${esc(p.title)}</h1>`);
    doc.querySelectorAll('h2.srchead + ul > li').forEach(li => { const m = li.textContent.match(/^\[([A-E])\]/); if (m) li.id = 'src-' + m[1]; });
    doc.querySelectorAll('a.tag').forEach(a => { const k = a.dataset.src; if (SRC[k]) a.title = '[' + k + '] ' + SRC[k]; });
    $('crumb').innerHTML = `LLM-Wiki ／ <a href="${W.repo}${p.file}" target="_blank" rel="noopener">${esc(p.file)}</a>`;
    document.title = p.title + '｜LLM-Wiki';
    const seq = wikiPages, k = seq.indexOf(p);
    const prev = k > 0 ? seq[k-1] : null, next = k >= 0 && k < seq.length - 1 ? seq[k+1] : (k < 0 ? seq[0] : null);
    $('pager').innerHTML = (prev ? `<a href="#${prev.id}"><small>← 上一頁</small>${esc(prev.title)}</a>` : '')
      + (next ? `<a class="next" href="#${next.id}"><small>下一頁 →</small>${esc(next.title)}</a>` : '');
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
    $('side').classList.remove('open');
    window.scrollTo(0, 0);
  }
  // tag 點擊：跳到本頁來源；本頁沒列就跳 00 總覽的來源清單
  document.addEventListener('click', e => {
    const a = e.target.closest('a.tag'); if (!a) return; e.preventDefault();
    let li = document.getElementById('src-' + a.dataset.src);
    if (!li) { location.hash = '00'; setTimeout(() => flash(document.getElementById('src-' + a.dataset.src)), 30); return; }
    flash(li);
  });
  function flash(li){ if (!li) return; li.scrollIntoView({block:'center'}); li.classList.add('hit'); setTimeout(() => li.classList.remove('hit'), 1600); }
  $('menu').addEventListener('click', () => $('side').classList.toggle('open'));
  const route = () => show((location.hash || '#00').slice(1));
  addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>

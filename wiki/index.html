<script id="wiki-data" type="application/json">{"slug": "workflow-selection", "repo": "https://github.com/nickyxu1985/universal-lesson-generator/blob/develop/", "pages": [{"id": "00", "title": "00 總覽：自動流程選型（固定自動流 → 單一 Agent → Multi-Agent）", "file": "wiki/workflow-selection/00-總覽.md", "html": "<h1>00 總覽：自動流程選型（固定自動流 → 單一 Agent → Multi-Agent）<\/h1>\n<blockquote>Job：w10-poc-004（v2，Wiki 增量）｜擷取日期 2026-11-19 CST｜主張後的 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 對應頁尾來源；原文存檔在 <code>raw/<\/code>。 標「示意」的段落是本 Wiki 為了教學自己舉的園遊會情境，不是來源的主張；概念與數字一律以 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 為準。<\/blockquote>\n<h2>一、定義<\/h2>\n<h3>1. 這份 Wiki 要回答的問題<\/h3>\n<p>同一件事，可以寫成一條固定的流程讓 AI 照著跑，也可以交給一個 Agent 讓它自己決定怎麼做，甚至拆給好幾個 Agent 分工。這份 Wiki 回答一個很實際的問題：遇到什麼樣的任務，該選哪一種做法，選錯了會付出什麼代價。<\/p>\n<h3>2. 總稱：agentic systems<\/h3>\n<p>Anthropic 觀察到「Agent」這個字有好幾種用法：有人指的是能長時間獨立運作、使用各種工具完成複雜任務的全自主系統，也有人指的是照預先定義的流程執行、規範性比較強的實作。Anthropic 把這些變體統稱為 agentic systems，但在架構上明確區分兩類：workflow 與 agent。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/p>\n<h3>3. 三個核心名詞<\/h3>\n<ul><li><strong>Workflow（固定自動流）<\/strong>：LLM 與工具透過「預先寫好的程式路徑」被編排起來執行。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 的說法是：workflow 有預定的程式路徑，設計成照一定順序運作。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>Agent（單一 Agent）<\/strong>：由 LLM 動態主導自己的流程與工具使用，自己掌握完成任務的方式。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 的說法是：agent 是動態的，會自己定義流程與工具使用。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>Multi-Agent（多 Agent 分工）<\/strong>：讓不同的專責 Agent 各自負責工作的不同部分；第一個設計決定是「在流程的每個分支，由誰負責給使用者的最終回覆」。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ul>\n<h3>4. 共同的地基：augmented LLM<\/h3>\n<p>不論是 workflow 還是 agent，最基本的積木都是「被強化過的 LLM」（augmented LLM）：在 LLM 外面加上檢索、工具與記憶等能力，模型可以自己產生搜尋查詢、挑選工具、決定要保留哪些資訊。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 也把 workflow 與 agentic system 的基礎描述為「LLM 加上各種強化」，例如工具呼叫、結構化輸出、短期記憶。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/p>\n<h3>5. 產品名詞不等於通用名詞<\/h3>\n<p>n8n 文件裡的 chain 與 agent 是 n8n 自家節點的定義：n8n 的 AI Agent 會決定要呼叫哪些工具、可以使用記憶；chain 則是一串 LLM 呼叫，不帶工具也不帶記憶。<a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a> 這是產品層的定義，不能直接套成「所有固定自動流都不能用工具或記憶」，因為 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 的 workflow 本身就建立在可以用工具與記憶的 augmented LLM 上。<\/p>\n<h2>二、運作方式：一條由簡入繁的複雜度階梯<\/h2>\n<p>把三種做法排成一條階梯，越往上，系統越有彈性，但也越貴、越難預測：<\/p>\n<div class=\"tbl\"><table><thead><tr><th>階梯<\/th><th>誰決定下一步<\/th><th>典型做法<\/th><th>依據<\/th><\/tr><\/thead><tbody><tr><td>0. 單次 LLM 呼叫<\/td><td>不需要決定<\/td><td>把單次呼叫配上檢索與範例優化好，很多應用這樣就夠<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><\/tr><tr><td>1. 固定自動流<\/td><td>程式（事先寫好）<\/td><td>prompt chaining、routing、parallelization、orchestrator-workers、evaluator-optimizer<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>2. 單一 Agent<\/td><td>LLM（邊做邊決定）<\/td><td>LLM 根據環境回饋，在迴圈裡使用工具<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>3. Multi-Agent<\/td><td>多個 Agent，依分支決定誰負責回覆<\/td><td>handoffs，或把專家 Agent 當工具呼叫<\/td><td><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>往上爬時真正改變的只有兩件事：<\/p>\n<ol><li><strong>路徑由誰決定<\/strong>：階梯 1 由程式決定，階梯 2 起由模型決定。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>最終回覆由誰負責<\/strong>：階梯 3 要先想清楚每個分支是專家接手對話，還是管理者保有最後回覆。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ol>\n<p>Anthropic 的建議是由最簡單的解法開始，只有需要時才增加複雜度，甚至可能根本不必建 agentic system。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 它也提醒：這些模式不是規定，而是可以依用途組合、調整的常見模式；成功的關鍵是衡量表現、反覆改進，並且只在能證明結果變好時才增加複雜度。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/p>\n<h2>三、例子<\/h2>\n<h3 class=\"srchead\">來源裡的例子<\/h3>\n<ul><li><strong>n8n 的對照範例<\/strong>：一個 Chat Trigger 接收聊天訊息，Switch 節點看訊息裡寫的是「agent」還是「chain」，把問題導到 AI Agent 或 Basic LLM Chain。AI Agent 接了 Wikipedia 工具與 Simple Memory，所以能查 Wikipedia 文章，也能回答「我上一個問題是什麼？」；Basic LLM Chain 不支援記憶與工具。範例建議分別對 agent 與 chain 問同樣的問題來比較。<a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a><\/li><li><strong>Anthropic 觀察到的兩個實務領域<\/strong>：客服（對話流程中需要查顧客資料、訂單紀錄、知識庫，還要執行退款、更新工單）與程式碼 Agent（解法可用自動化測試驗證、能用測試結果回饋迭代）。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>OpenAI 的分流例子<\/strong>：一個 Triage agent 可以把對話交給 Billing agent 或 Refund agent 接手。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ul>\n<h3>示意：班上要辦園遊會<\/h3>\n<ul><li>收報名表 → 整理名單 → 寄通知，每次步驟都一樣：適合固定自動流。<\/li><li>「想辦法讓攤位不撞名又有人潮」，步驟要邊做邊想：才考慮單一 Agent。<\/li><li>場地、宣傳、財務各有不同規則與工具：分工真的帶來好處時，才考慮 Multi-Agent。<\/li><\/ul>\n<p>（以上三點是教學比喻，判斷依據分別見 01、02、03 頁的來源主張。）<\/p>\n<h3 class=\"srchead\">同一件事在三層的樣子（對照來源）<\/h3>\n<ul><li>客服可以是 routing：先把一般問題、退款、技術支援分類，再導到不同的流程、prompt 與工具。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>客服也可以是 agent：在對話中自己查顧客資料與訂單，並執行退款或更新工單。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>客服還可以是 multi-agent：由分流 Agent 把對話交給帳務或退款專家接手。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ul>\n<p>同一個領域可以落在不同層，決定落點的是任務本身能不能事先寫死，而不是領域名稱。（最後一句為本 Wiki 歸納。）<\/p>\n<h2>四、適用情境與取捨<\/h2>\n<ul><li><strong>用延遲與成本換表現<\/strong>：agentic system 常用較高的延遲與成本，換取更好的任務表現，要先想清楚這筆交換值不值得。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>可預測 vs 彈性<\/strong>：任務定義清楚時，workflow 提供可預測性與一致性；需要大規模的彈性與模型自主決策時，agent 比較合適。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>最簡單的常常就夠<\/strong>：很多應用把單次 LLM 呼叫配上檢索與情境內範例優化好，通常就夠了。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>框架的取捨<\/strong>：框架能簡化呼叫 LLM、定義與解析工具、串接呼叫等低階工作，但常多出抽象層，讓底層的 prompt 與回應被遮住、難以除錯，也讓人忍不住加上不必要的複雜度；建議先直接用 LLM API，用框架就要理解底層程式碼。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>Multi-Agent 的取捨<\/strong>：能用一個 Agent 就先用一個；只有在能明顯改善能力隔離、政策隔離、提示清晰度或追蹤可讀性時才加專家，太早拆會多出更多 prompt、trace 與核准點。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>可解釋性<\/strong>：ReAct 讓模型交錯產生推理軌跡與行動，論文指出這樣產生的解題軌跡比沒有推理軌跡的基準更容易解讀。<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><\/li><\/ul>\n<h3>貫穿全書的三條實作原則<\/h3>\n<p>Anthropic 在總結時提到，實作 Agent 時盡量遵守三個核心原則：<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/p>\n<ol><li><strong>簡單<\/strong>：讓 Agent 的設計保持簡單。<\/li><li><strong>透明<\/strong>：明確顯示 Agent 的規劃步驟。<\/li><li><strong>用心設計 Agent 與電腦之間的介面（ACI）<\/strong>：工具要有完整的文件，並且經過充分測試。<\/li><\/ol>\n<p>它也提醒：在 LLM 領域，成功不在於做出最精密的系統，而在於做出「符合需求的對的系統」；先從簡單的 prompt 開始，用完整的評估去優化，簡單方案不夠時才加入多步驟的 agentic system。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 這三條原則與「由簡入繁」的方向，是後面四頁共同的判斷基準。<\/p>\n<h2>五、常見錯誤<\/h2>\n<ol><li><strong>一開始就做最複雜的版本<\/strong>：跳過單次呼叫與固定流程，直接做 Agent 或多 Agent。來源的原則正好相反：先找最簡單的解法，只有簡單方案不夠時才加多步驟的 agentic system。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>把 n8n 的節點限制當成通用規則<\/strong>：「chain 不帶工具與記憶」是 n8n Basic LLM Chain 的產品定義 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>，一般 workflow 的 LLM 可以帶工具與記憶 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>。<\/li><li><strong>以為 Agent 越多越強<\/strong>：太早拆 Agent，會多出更多 prompt、trace 與核准點，不一定讓流程變好。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>只用框架、不懂底層<\/strong>：對框架底層的錯誤假設，是客戶常見的錯誤來源。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>把論文數字講成通則<\/strong>：ReAct 的 34 與 10 個百分點，是在 ALFWorld 與 WebShop 兩個 benchmark、對上模仿學習與強化學習方法的結果，不是「所有 Agent 都會進步這麼多」。<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><\/li><li><strong>忽略來源的時效<\/strong>：Anthropic 在文章開頭註明，文中描述的工具生態自 2024 年 12 月以來已有很多改變。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 引用框架與工具名稱時要注意時間點，模式與原則才是本 Wiki 主要採用的部分。<\/li><\/ol>\n<h2>六、本 Wiki 怎麼讀<\/h2>\n<ul><li>01 固定自動流：五種 workflow 模式，各自怎麼運作、什麼時候用。<\/li><li>02 單一 Agent：工具迴圈、ReAct、停止條件與護欄。<\/li><li>03 Multi-Agent：handoffs 與 agents as tools，什麼時候才拆。<\/li><li>04 選型決策：把前三頁整理成一張「遇到什麼情況選哪個」的決策表與檢查清單。<\/li><\/ul>\n<h2 class=\"srchead\">本頁來源<\/h2>\n<ul><li><a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a> n8n — Agents vs chains：<a href=\"https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains\" target=\"_blank\" rel=\"noopener\">https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains<\/a>（存檔 <code>raw/A-n8n-agents-vs-chains.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> Anthropic — Building effective agents（2024-12-19）：<a href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/building-effective-agents<\/a>（存檔 <code>raw/B-anthropic-building-effective-agents.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> OpenAI — Orchestration and handoffs：<a href=\"https://developers.openai.com/api/docs/guides/agents/orchestration\" target=\"_blank\" rel=\"noopener\">https://developers.openai.com/api/docs/guides/agents/orchestration<\/a>（存檔 <code>raw/C-openai-orchestration-and-handoffs.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a> Yao et al. — ReAct: Synergizing Reasoning and Acting in Language Models（arXiv:2210.03629，v3 2023-03-10，引用摘要頁）：<a href=\"https://arxiv.org/abs/2210.03629\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2210.03629<\/a>（存檔 <code>raw/D-react-arxiv-2210.03629.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> LangGraph — Workflows and agents：<a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">https://docs.langchain.com/oss/python/langgraph/workflows-agents<\/a>（存檔 <code>raw/E-langgraph-workflows-and-agents.md<\/code>）<\/li><\/ul>"}, {"id": "01", "title": "01 固定自動流（Workflow）", "file": "wiki/workflow-selection/01-固定自動流.md", "html": "<h1>01 固定自動流（Workflow）<\/h1>\n<blockquote>Job：w10-poc-004（v2，Wiki 增量）｜主張後的 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 對應頁尾來源；標「示意」的是本 Wiki 的教學情境，不是來源主張。<\/blockquote>\n<h2>一、定義<\/h2>\n<ul><li><strong>Workflow 是預先寫好路徑的系統<\/strong>：LLM 與工具透過預先定義的程式路徑被編排執行。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 的說法是：workflow 有預定的程式路徑，設計成照一定順序運作。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>它的強項是可預測<\/strong>：對定義清楚的任務，workflow 提供可預測性與一致性。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>它不是「不能用工具的流程」<\/strong>：workflow 的每一次 LLM 呼叫，都可以是帶著檢索、工具與記憶的 augmented LLM；Anthropic 在介紹各種 workflow 前就說明，之後都假設每次 LLM 呼叫都能使用這些強化能力。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 也把工具呼叫、結構化輸出與短期記憶列為 workflow 與 agentic system 共同的強化選項。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>它和 Agent 的差別在「誰決定路徑」<\/strong>：workflow 的路徑由程式事先決定；agent 則由 LLM 動態主導自己的流程與工具使用。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><\/ul>\n<h2>二、運作方式：五種常見模式<\/h2>\n<p><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 與 <a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 列出的是同一組五種模式。下面逐一說明它怎麼跑、檢查點放在哪裡。<\/p>\n<h3>1. Prompt chaining（提示串接）<\/h3>\n<ul><li><strong>怎麼跑<\/strong>：把任務拆成一連串步驟，每一次 LLM 呼叫處理上一步的輸出。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>檢查點<\/strong>：可以在任何中間步驟加上程式化檢查（Anthropic 圖中稱為 gate），確保流程還在正軌上。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 的範例就是這樣做：先產生一個笑話，再用一個檢查函式判斷 Pass 或 Fail；Fail 才進入「改進」與「潤飾」兩步，Pass 就直接結束。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>核心交換<\/strong>：用延遲換準確度，讓每一次 LLM 呼叫都只做比較簡單的事。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<h3>2. Routing（分流）<\/h3>\n<ul><li><strong>怎麼跑<\/strong>：先把輸入分類，再導到專門的後續任務。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>好處<\/strong>：讓關注點分離，可以寫更專門的 prompt；沒有分流時，為某一類輸入最佳化，可能會傷害其他類輸入的表現。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>分類器不一定是 LLM<\/strong>：分類可以由 LLM 做，也可以用比較傳統的分類模型或演算法，前提是分類夠準。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 的範例則是讓 LLM 以結構化輸出決定路由，再用條件邊導向對應節點。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><\/ul>\n<h3>3. Parallelization（平行化）<\/h3>\n<ul><li><strong>怎麼跑<\/strong>：讓多個 LLM 同時處理任務，再用程式彙整輸出。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 有兩種變形：<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><ul><li><strong>Sectioning（分段）<\/strong>：把任務拆成彼此獨立的子任務同時跑，目的是加速。<\/li><li><strong>Voting（投票）<\/strong>：同一個任務跑很多次，取得多樣的輸出，目的是提高信心。<\/li><\/ul><\/li><li><strong>為什麼有效<\/strong>：面對有多個考量的複雜任務，讓每個考量各由一次獨立的 LLM 呼叫處理、專心看一個面向，LLM 通常表現更好。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<h3>4. Orchestrator-workers（指揮者－工作者）<\/h3>\n<ul><li><strong>怎麼跑<\/strong>：由一個中央 LLM 動態拆解任務、派給 worker LLM，再彙整結果。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 描述為：拆任務、派子任務、把 worker 的輸出合成最終結果。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>和平行化的差別<\/strong>：外形相似，但子任務不是事先定義好的，而是由 orchestrator 依照具體輸入決定。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 用 <code>Send<\/code> API 動態建立 worker 節點並送出各自的輸入；每個 worker 有自己的狀態，所有輸出寫進一個共用的狀態鍵，讓 orchestrator 讀取並合成。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><\/ul>\n<h3>5. Evaluator-optimizer（評估－優化迴圈）<\/h3>\n<ul><li><strong>怎麼跑<\/strong>：一次 LLM 呼叫產生回應，另一次負責評估並給回饋，在迴圈中反覆進行。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 若評估者或人工審核（human-in-the-loop）判斷還需要修改，就提供回饋並重新產生，直到得到可接受的回應為止。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>類比<\/strong>：就像作者寫出一份完善文件之前反覆修稿的過程。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<h2>三、例子<\/h2>\n<h3 class=\"srchead\">來源裡的例子<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>模式<\/th><th>來源舉的例子<\/th><\/tr><\/thead><tbody><tr><td>Prompt chaining<\/td><td>先寫行銷文案再翻譯成另一種語言；先寫大綱、檢查大綱是否符合標準，再依大綱寫全文。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 翻譯文件、檢查生成內容的一致性。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>Routing<\/td><td>把一般問題、退款申請、技術支援分到不同的下游流程、prompt 與工具。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 把簡單常見的問題交給較小、較省成本的模型（如 Claude Haiku 4.5），困難少見的交給能力較強的模型（如 Claude Sonnet 4.5）。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 產品問答先判斷問題類型，再導到價格、退款、退貨等流程。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>Parallelization<\/td><td>Sectioning：一個模型處理使用者問題，另一個同時篩查不當內容，通常比同一次呼叫兼顧兩件事效果好；自動化評估時每次呼叫評一個面向。Voting：多個不同 prompt 一起檢查程式碼漏洞；用多個 prompt 與不同投票門檻判斷內容是否不當，平衡誤報與漏報。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 一個子任務抽關鍵字、另一個查格式錯誤；依引用數、來源數、來源品質等不同標準多次評分。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>Orchestrator-workers<\/td><td>每次都要改很多檔案的程式產品；要從多個來源蒐集並分析資訊的搜尋任務。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 要在數量未知的文件裡更新多個 Python 套件的安裝說明。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>Evaluator-optimizer<\/td><td>文學翻譯：譯者 LLM 一開始抓不到的細微差異，由評估者 LLM 提出批評。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 需要多輪搜尋與分析的複雜搜尋任務，由評估者決定要不要再搜。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 兩種語言之間翻譯不一定有完美對應，可能要幾輪才能譯出同樣意思。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>n8n 的 chain（產品例子）<\/h3>\n<ul><li>n8n 的 Basic LLM Chain 節點可以和接上的 LLM 對話，但不支援記憶與工具；n8n 的 chain 不使用持久記憶，所以無法參照先前的對話內容，要參照就得改用 AI agent。<a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a><\/li><li>在 n8n 的範例中，對 chain 問「我上一個問題是什麼？」，就是用來對照 chain 沒有記憶的情況。<a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a><\/li><\/ul>\n<h3>示意：園遊會的固定流程<\/h3>\n<ul><li>每天固定把報名表整理成名單、檢查欄位有沒有漏填（gate）、再寄通知信：步驟固定，適合 prompt chaining。<\/li><li>收到的問題先分成「場地」「繳費」「其他」三類，再交給各自的回覆範本：適合 routing。<\/li><\/ul>\n<h2>四、適用情境與取捨<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>模式<\/th><th>什麼時候用<\/th><th>付出的代價<\/th><\/tr><\/thead><tbody><tr><td>Prompt chaining<\/td><td>任務能輕鬆、乾淨地拆成固定子任務 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；可拆成較小、可驗證的步驟 <a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><td>多步驟會增加延遲，換來準確度 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><\/tr><tr><td>Routing<\/td><td>有明確類別、分開處理比較好，而且分類能做得準 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><td>分類必須能做得準是前提 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；分錯類，後續就會進到不對的專門流程（本 Wiki 推論）<\/td><\/tr><tr><td>Parallelization<\/td><td>子任務可同時跑以加速，或需要多種觀點、多次嘗試以提高信心 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><td>Voting 要把同一任務跑很多次 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>，呼叫次數隨之增加（本 Wiki 推論）<\/td><\/tr><tr><td>Orchestrator-workers<\/td><td>無法預測需要哪些子任務的複雜任務 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；子任務無法像平行化那樣事先定義 <a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><td>子任務由 orchestrator 依輸入決定 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>，換來彈性；事先無法完全知道會拆成哪些子任務（本 Wiki 推論）<\/td><\/tr><tr><td>Evaluator-optimizer<\/td><td>有清楚的評估標準，反覆修改能帶來可衡量的價值 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><td>迴圈會重跑生成與評估，直到通過為止 <a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>判斷 evaluator-optimizer 合不合用的兩個訊號<\/strong>：第一，人說出回饋後，LLM 的回應能明顯變好；第二，LLM 本身也能提供這樣的回饋。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>本 Wiki 對「推論」的標法<\/strong>：表中標「本 Wiki 推論」的句子，是從來源定義直接推出的代價，不是來源原文；驗證時可對照前一欄的來源句。<\/li><li><strong>整體取捨<\/strong>：固定自動流用預先寫好的路徑換來可預測性與一致性 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；它適合「怎麼做已經想清楚」的任務，路徑寫不死的情況則見 02 單一 Agent。<\/li><\/ul>\n<h2>五、常見錯誤<\/h2>\n<ol><li><strong>把 n8n 的 chain 限制當成所有 workflow 的限制<\/strong>：「沒有工具、沒有記憶」只是 n8n Basic LLM Chain 的產品定義 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>；一般 workflow 的 LLM 可以帶工具、檢索與記憶 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>。<\/li><li><strong>以為 orchestrator-workers 就是平行化<\/strong>：兩者外形相似，但平行化的子任務是事先定義的，orchestrator-workers 的子任務是看輸入動態決定的。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>分類不準還硬做 routing<\/strong>：routing 適用的前提之一是分類能被準確處理。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>沒有標準就做評估迴圈<\/strong>：evaluator-optimizer 適合有清楚評估標準、反覆修改有可衡量價值的情況 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；沒有標準，就難以判斷何時算「可接受的回應」<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>。<\/li><li><strong>中間步驟不設檢查<\/strong>：prompt chaining 可以在任何中間步驟加程式化檢查，確保流程還在正軌上 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；不設 gate，錯誤會一路傳到最後一步。<\/li><li><strong>把模式當規定<\/strong>：這些是可以依用途組合與調整的常見模式，不是一定要照做的規範；只在能證明結果變好時才增加複雜度。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ol>\n<h2 class=\"srchead\">本頁來源<\/h2>\n<ul><li><a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a> n8n — Agents vs chains：<a href=\"https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains\" target=\"_blank\" rel=\"noopener\">https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains<\/a>（存檔 <code>raw/A-n8n-agents-vs-chains.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> Anthropic — Building effective agents（2024-12-19）：<a href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/building-effective-agents<\/a>（存檔 <code>raw/B-anthropic-building-effective-agents.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> LangGraph — Workflows and agents：<a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">https://docs.langchain.com/oss/python/langgraph/workflows-agents<\/a>（存檔 <code>raw/E-langgraph-workflows-and-agents.md<\/code>）<\/li><\/ul>"}, {"id": "02", "title": "02 單一 Agent", "file": "wiki/workflow-selection/02-單一-agent.md", "html": "<h1>02 單一 Agent<\/h1>\n<blockquote>Job：w10-poc-004（v2，Wiki 增量）｜主張後的 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 對應頁尾來源；標「示意」的是本 Wiki 的教學情境，標「本 Wiki 推論」的是由來源推出、非原文的句子。<\/blockquote>\n<h2>一、定義<\/h2>\n<ul><li><strong>Agent 由 LLM 自己主導流程<\/strong>：agent 是 LLM 動態主導自己的流程與工具使用、自己掌握如何完成任務的系統。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 的說法是：agent 是動態的，會自己定義流程與工具使用。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>實作上通常很單純<\/strong>：agent 能處理複雜任務，但實作往往很直接，通常就是「LLM 根據環境回饋，在迴圈裡使用工具」。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 也說 agent 通常實作成「LLM 使用工具執行動作」，在持續的回饋迴圈中運作。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>自主，但不是沒有邊界<\/strong>：agent 比 workflow 更有自主性，可以決定要用哪些工具、怎麼解題；但開發者仍然可以定義可用的工具組，以及 agent 行為的準則。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>n8n 的產品定義<\/strong>：n8n 的 AI Agent 節點會和工作流程中的其他元件互動，決定要使用哪些工具，並且可以使用記憶；n8n 對 AI agent 的說明是能回應請求、做決定、替使用者執行真實世界任務的 AI 系統。<a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a><\/li><\/ul>\n<h2>二、運作方式<\/h2>\n<h3>1. 一次任務的生命週期（Anthropic 的描述）<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/h3>\n<ol><li><strong>開始<\/strong>：agent 從使用者的指令，或與使用者的互動討論開始工作。<\/li><li><strong>規劃與執行<\/strong>：任務清楚後，agent 自己規劃、獨立運作，必要時回頭向使用者要更多資訊或判斷。<\/li><li><strong>每一步取得 ground truth<\/strong>：執行中，agent 每一步都要從環境取得「真實結果」來評估進度，例如工具呼叫的結果或程式執行的結果。<\/li><li><strong>檢查點與卡關<\/strong>：在檢查點，或遇到阻礙時，agent 可以暫停下來等人回饋。<\/li><li><strong>結束<\/strong>：任務通常在完成時結束，但也常加上停止條件（例如最大迭代次數）來保持控制。<\/li><\/ol>\n<h3>2. 工具迴圈長什麼樣（LangGraph 的圖）<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/h3>\n<ul><li>圖裡只有兩個主要節點：一個是 LLM 呼叫（<code>llm_call<\/code>），一個是執行工具的節點（<code>tool_node<\/code>）。<\/li><li>從起點進入 LLM 呼叫；接著由一條條件邊判斷 LLM 有沒有發出工具呼叫：有，就去執行工具，執行完再回到 LLM；沒有，就結束。<\/li><li>範例中，agent 拿到加、乘、除三個工具，被問「3 加 4」時，由 LLM 決定要呼叫哪個工具。<\/li><li>LangGraph 的 <code>ToolNode<\/code> 是預建的工具執行節點，會自動處理平行執行工具、錯誤處理與狀態注入。<\/li><\/ul>\n<h3>3. 理論根源：ReAct（推理＋行動交錯）<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><\/h3>\n<ul><li>過去 LLM 的「推理」（例如 chain-of-thought）與「行動」（例如產生行動計畫）多被分開研究。<\/li><li>ReAct 讓 LLM 交錯產生推理軌跡與針對任務的行動：推理軌跡幫助模型擬定、追蹤、更新行動計畫，並處理例外；行動讓模型能接觸外部來源（例如知識庫或環境）蒐集更多資訊。<\/li><li>這正好對應 Anthropic 說的「每一步從環境取得 ground truth」<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>：行動取得的結果，就是下一輪推理的依據（本 Wiki 推論，把兩份來源的描述對照）。<\/li><\/ul>\n<h3>4. 工具就是 agent 的介面<\/h3>\n<p>因為 agent 本質上是「在迴圈裡用工具的 LLM」，所以工具組與工具文件要設計得清楚而周到。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> Anthropic 把這稱為 agent 與電腦之間的介面（ACI），建議投入跟設計人機介面（HCI）一樣多的心力：<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/p>\n<ul><li>站在模型的角度想：看描述與參數就知道怎麼用嗎？好的工具定義常包含使用範例、邊界情況、輸入格式要求，以及和其他工具的清楚分界。<\/li><li>改參數名稱或描述讓它更明顯，就像替團隊裡的新進工程師寫一份好的 docstring；有很多相似工具時特別重要。<\/li><li>實際測試模型怎麼用工具：跑大量範例輸入，看模型犯什麼錯，再迭代。<\/li><li>防呆（poka-yoke）：改變參數設計，讓模型更難犯錯。<\/li><li>工具格式的建議：給模型足夠的 token 先「想」；格式貼近網路上自然出現的文字；避免格式負擔，例如要精確數幾千行程式碼，或替程式碼做字串跳脫。<\/li><\/ul>\n<h2>三、例子<\/h2>\n<h3 class=\"srchead\">來源裡的例子<\/h3>\n<ul><li><strong>ReAct 的實驗<\/strong>：在問答（HotpotQA）與事實查核（Fever）上，ReAct 透過與簡單的 Wikipedia API 互動，克服 chain-of-thought 推理常見的幻覺與錯誤傳遞問題，產生的解題軌跡比沒有推理軌跡的基準更容易解讀。<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a> 在兩個互動式決策 benchmark（ALFWorld 與 WebShop）上，ReAct 只用一到兩個情境內範例提示，絕對成功率分別比模仿學習與強化學習方法高 34 與 10 個百分點。<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><\/li><li><strong>Anthropic 自己的實作<\/strong>：解決 SWE-bench 任務的程式碼 agent（依任務描述修改很多檔案），以及讓 Claude 操作電腦完成任務的 computer use 參考實作。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>SWE-bench 的工具教訓<\/strong>：建 SWE-bench agent 時，Anthropic 花在優化工具的時間比優化整體 prompt 還多；模型在 agent 離開根目錄後使用相對路徑會出錯，改成工具一律要求絕對路徑後，模型就能完美使用。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>客服與程式碼<\/strong>：客服適合比較開放的 agent，因為對話中需要外部資訊與動作（查顧客資料、訂單、知識庫，處理退款或更新工單），成功也能用使用者定義的「問題解決」來衡量。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 程式碼 agent 特別有效，因為解法能用自動化測試驗證、能用測試結果迭代、問題空間定義清楚、輸出品質可客觀衡量；但人工審查仍然重要，才能確保解法符合更大的系統需求。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>n8n 的範例<\/strong>：AI Agent 接了 Wikipedia 工具與 Simple Memory，可以查 Wikipedia 文章，也能回答「我上一個問題是什麼？」。<a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a><\/li><\/ul>\n<h3>示意：園遊會<\/h3>\n<p>「想辦法讓攤位不撞名又有人潮」：agent 先查已登記的攤位名單（行動）→ 發現有兩攤都叫「珍奶站」（觀察）→ 想到要請其中一攤改名、再查人潮動線（推理）→ 再查場地圖（行動）……事先不知道要幾步，只能邊做邊決定，這就是 agent 的典型情境。<\/p>\n<h2>四、適用情境與取捨<\/h2>\n<h3>什麼時候用<\/h3>\n<ul><li><strong>開放式問題<\/strong>：很難或不可能事先預測需要幾步、也無法寫死固定路徑時。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> LangGraph 的說法是：用在問題與解法都難以預測的情況。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>可以信任它的決策<\/strong>：LLM 可能會跑很多輪，你必須對它的決策有一定程度的信任；agent 的自主性讓它很適合在受信任的環境中擴大規模執行任務。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>最能發揮價值的任務特徵<\/strong>：同時需要對話與行動、有清楚的成功標準、能形成回饋迴圈，並且納入有意義的人工監督。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<h3>付出的代價<\/h3>\n<ul><li><strong>成本較高、錯誤會累積<\/strong>：自主性意味著較高的成本，以及錯誤一路累積（compounding errors）的可能；建議在沙盒環境中大量測試，並設置適當的護欄。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>延遲與成本換表現<\/strong>：agentic system 常以延遲與成本換取更好的任務表現。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>可控性<\/strong>：要用停止條件（例如最大迭代次數）保持控制，並在檢查點讓人介入。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<h2>五、常見錯誤<\/h2>\n<ol><li><strong>路徑其實寫得死，卻用 Agent<\/strong>：任務能乾淨拆成固定子任務時，prompt chaining 等 workflow 就夠了，而且更可預測（見 01）。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>不設停止條件<\/strong>：沒有最大迭代次數之類的條件，就少了保持控制的手段。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>不看環境回饋、憑空推進<\/strong>：agent 每一步都要從環境取得 ground truth 評估進度 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；ReAct 的實驗也顯示，與外部來源互動能減少幻覺與錯誤傳遞 <a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a>。<\/li><li><strong>只改 prompt、不改工具<\/strong>：工具定義應該得到和整體 prompt 一樣多的提示工程關注 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；SWE-bench 的例子中，改工具（改成絕對路徑）才解決錯誤 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>。<\/li><li><strong>以為有自動測試就不用人看<\/strong>：自動化測試能驗證功能，但人工審查仍是確保解法符合系統需求的關鍵。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>把 ReAct 的數字講成通則<\/strong>：34 與 10 個百分點只是 ALFWorld 與 WebShop 上、對上模仿學習與強化學習方法的結果，不能說成「一般 Agent 都會提升 34／10 個百分點」。<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><\/li><li><strong>混用產品與通用定義<\/strong>：「Agent 可以用記憶、chain 不行」是 n8n 節點的定義 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>，不是 workflow 與 agent 在一般架構上的分界（分界在誰決定路徑 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>）。<\/li><\/ol>\n<h2 class=\"srchead\">本頁來源<\/h2>\n<ul><li><a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a> n8n — Agents vs chains：<a href=\"https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains\" target=\"_blank\" rel=\"noopener\">https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains<\/a>（存檔 <code>raw/A-n8n-agents-vs-chains.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> Anthropic — Building effective agents（2024-12-19）：<a href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/building-effective-agents<\/a>（存檔 <code>raw/B-anthropic-building-effective-agents.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a> Yao et al. — ReAct: Synergizing Reasoning and Acting in Language Models（arXiv:2210.03629，v3 2023-03-10，引用摘要頁）：<a href=\"https://arxiv.org/abs/2210.03629\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2210.03629<\/a>（存檔 <code>raw/D-react-arxiv-2210.03629.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> LangGraph — Workflows and agents：<a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">https://docs.langchain.com/oss/python/langgraph/workflows-agents<\/a>（存檔 <code>raw/E-langgraph-workflows-and-agents.md<\/code>）<\/li><\/ul>"}, {"id": "03", "title": "03 Multi-Agent", "file": "wiki/workflow-selection/03-multi-agent.md", "html": "<h1>03 Multi-Agent<\/h1>\n<blockquote>Job：w10-poc-004（v2，Wiki 增量）｜主張後的 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 對應頁尾來源；標「示意」的是本 Wiki 的教學情境，標「本 Wiki 推論」的是由來源推出、非原文的句子。<\/blockquote>\n<h2>一、定義<\/h2>\n<ul><li><strong>Multi-Agent 是讓專家分工<\/strong>：當不同的專家應該各自負責工作的不同部分時，multi-agent workflow 才有用。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>第一個設計決定是「誰負責回覆」<\/strong>：設計 multi-agent 時，第一個要決定的是：在流程的每一個分支，由誰負責給使用者的最終回覆。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>兩種編排方式<\/strong>：OpenAI 把它分成 handoffs（交棒）與 agents as tools（把專家 Agent 當工具呼叫）兩種模式。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>和 workflow 的關係<\/strong>：Anthropic 與 LangGraph 都列出 orchestrator-workers 這個 workflow 模式：由中央 LLM 動態拆解任務、派給 worker、再彙整結果。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 它是固定自動流中最接近「多 Agent 分工」的模式（本 Wiki 推論：兩者都是一個中心角色派工、多個角色執行；差別在 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 把它歸類為 workflow，<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> 討論的則是每個專家都是一個 Agent）。<\/li><\/ul>\n<h2>二、運作方式<\/h2>\n<h3>1. 兩種模式對照 <a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/h3>\n<div class=\"tbl\"><table><thead><tr><th>模式<\/th><th>什麼時候用<\/th><th>發生什麼事<\/th><\/tr><\/thead><tbody><tr><td>Handoffs（交棒）<\/td><td>某個專家應該接手這個分支的對話<\/td><td>控制權轉移到專家 Agent<\/td><\/tr><tr><td>Agents as tools（當工具用）<\/td><td>管理者應該保持控制，把專家當成有範圍限制的能力來呼叫<\/td><td>管理者保有回覆的所有權<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>2. Handoffs：把「負責權」交出去 <a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/h3>\n<ul><li><strong>適用<\/strong>：當專家應該負責「下一個回覆」，而不只是在背後幫忙時，handoffs 最合適。<\/li><li><strong>怎麼設定<\/strong>：OpenAI Agents SDK 的範例中，Triage agent（分流 Agent）的 <code>handoffs<\/code> 清單裡放了 Billing agent 與 Refund agent，表示分流 Agent 可以把對話交給這兩位專家接手。<\/li><li><strong>讓分流介面保持清楚<\/strong>：<ul><li>每個專家只給一個窄的工作範圍。<\/li><li>交棒說明（Python 的 <code>handoff_description<\/code>、TypeScript 的 <code>handoffDescription<\/code>）要寫得短而具體。<\/li><li>只有在下一個分支真的需要不同的指令、工具或政策時才拆。<\/li><\/ul><\/li><li><strong>進階<\/strong>：交棒時也可以帶結構化的 metadata 或過濾過的對話歷史；確切 API 寫在 SDK 文件，因為不同語言的接法不同。<\/li><\/ul>\n<h3>3. Agents as tools：管理者保有最後回覆 <a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/h3>\n<ul><li><strong>怎麼設定<\/strong>：用 Python 的 <code>agent.as_tool()<\/code>（TypeScript 是 <code>agent.asTool()<\/code>），把專家 Agent 包成主 Agent 的一個工具；主 Agent 仍然負責最終答案，只是把專家當幫手呼叫。<\/li><li><strong>範例<\/strong>：一個 Summarizer（摘要 Agent），指令是「為提供的文字產生精簡摘要」，被包成 <code>summarize_text<\/code> 工具，交給 Research assistant（研究助理 Agent）使用。<\/li><li><strong>通常比較適合的情況<\/strong>：<ul><li>管理者應該整合出最終答案；<\/li><li>專家做的是有範圍的任務，例如摘要或分類；<\/li><li>你想要一個穩定的外層流程、在裡面巢狀呼叫專家，而不是轉移負責權。<\/li><\/ul><\/li><\/ul>\n<h3>4. Orchestrator-workers 的分工機制 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/h3>\n<ul><li>中央 LLM 依照具體輸入動態決定子任務，不是事先定義好的。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>LangGraph 用 <code>Send<\/code> API 動態建立 worker 節點並送出各自的輸入；每個 worker 有自己的狀態，所有 worker 的輸出寫進同一個共用狀態鍵，orchestrator 讀得到全部輸出，再合成最終結果。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li>LangGraph 的範例是：先由規劃器用結構化輸出列出報告的各個章節，再把每個章節送給一個 worker 撰寫，最後由合成節點整合成完整報告。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><\/ul>\n<h3>5. 執行之後：狀態與下一輪 <a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/h3>\n<p>OpenAI 的指南在最後提醒，負責權的模式確定後，還要處理相鄰的執行與狀態問題，例如「最後一個 Agent」（Python 的 <code>last_agent<\/code>）與可恢復的狀態，會影響下一輪由誰接手。這表示用 handoffs 時，下一輪對話不一定回到原本的分流 Agent（本 Wiki 推論，細節以 SDK 文件為準）。<\/p>\n<h3>6. 「分工」的想法在 workflow 裡早就出現過<\/h3>\n<p>Multi-Agent 不是憑空多出來的新概念，前面幾種 workflow 已經用到「讓不同的 LLM 呼叫各做各的事」：<\/p>\n<ul><li><strong>Routing<\/strong>：把不同類型的客服問題分到不同的下游流程、prompt 與工具；或把簡單常見的問題交給較小、較省成本的模型，把困難少見的問題交給能力較強的模型。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 這和 Triage agent 交棒給專家的形狀很像，差別在 routing 的下游是預先寫好的流程（本 Wiki 推論）。<\/li><li><strong>Parallelization 的 sectioning<\/strong>：一個模型實例處理使用者問題，另一個同時篩查不當內容或請求，通常比讓同一次 LLM 呼叫同時兼顧護欄與主要回覆效果更好。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>為什麼分開會比較好<\/strong>：面對有多個考量的複雜任務，讓每個考量由一次獨立的 LLM 呼叫處理、專注在一個面向上，LLM 通常表現更好。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<p>這也說明了 <a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> 列出的「提示清晰度」為什麼是拆分的好理由：每個角色只看自己那一塊，prompt 才能寫得專門（本 Wiki 推論，對照 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 的 routing 說明：沒有分流時，為某類輸入最佳化可能傷害其他類輸入的表現）。<\/p>\n<h2>三、例子<\/h2>\n<h3 class=\"srchead\">來源裡的例子<\/h3>\n<ul><li><strong>客服分流（handoffs）<\/strong>：Triage agent 把帳務問題交給 Billing agent、退款問題交給 Refund agent，由專家接手該分支的對話。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>研究助理（agents as tools）<\/strong>：Research assistant 保有最終回覆，需要時呼叫 Summarizer 產生摘要。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>報告撰寫（orchestrator-workers）<\/strong>：規劃器拆出報告章節，每個 worker 寫一節，合成節點整合成最終報告。<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>程式與搜尋（orchestrator-workers）<\/strong>：每次都要修改多個檔案的程式產品，以及要從多個來源蒐集、分析資訊的搜尋任務。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<h3>示意：園遊會總召<\/h3>\n<ul><li>總召 Agent 收到「幫我們班規劃園遊會」：場地組要看學校場地規則、宣傳組要用海報與社群工具、財務組要守收支規定。三組的指令、工具、規則都不一樣，拆開才有道理。<\/li><li>若同學問「我們攤位在哪裡？」，總召把對話交給場地組直接回答：這是 handoffs。<\/li><li>若總召要寫一份給導師的總報告，只請財務組算好收支數字、自己整合成報告：這是 agents as tools。<\/li><li>反過來，如果只是「把報名名單整理好寄出去」，一個流程就做完了，硬拆三組只會多出更多交接。<\/li><\/ul>\n<h2>四、適用情境與取捨<\/h2>\n<h3>什麼時候才拆<\/h3>\n<ul><li><strong>先用一個 Agent<\/strong>：能用一個就先用一個。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>拆了要有明確好處<\/strong>：只有在專家能明顯改善下列至少一項時才加：能力隔離、政策隔離、提示清晰度、追蹤可讀性。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>契約改變了才拆<\/strong>：OpenAI 用「Add specialists only when the contract changes」當小節標題，並要求只有在下一個分支真的需要不同的指令、工具或政策時才拆。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ul>\n<h3>拆的代價<\/h3>\n<ul><li>太早拆，會多出更多 prompt、更多 trace（執行軌跡）、更多需要核准的地方，卻不一定讓流程變好。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ul>\n<h3>核准點與人工監督<\/h3>\n<ul><li><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> 提到太早拆會多出「approval surfaces」，也就是更多需要人核准的地方。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li>Anthropic 觀察到，agent 最能發揮價值的任務，會納入有意義的人工監督。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>兩者合起來看：每多一個專家，就可能多一個需要人看的關卡；拆分前要先算清楚，人工監督的負擔是否還承受得起（本 Wiki 推論）。<\/li><\/ul>\n<h3>Handoffs 還是 agents as tools<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>想要的結果<\/th><th>選擇<\/th><th>依據<\/th><\/tr><\/thead><tbody><tr><td>專家直接面對使用者、負責下一個回覆<\/td><td>Handoffs<\/td><td><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><tr><td>管理者整合最終答案，專家只做摘要、分類這類有範圍的工作<\/td><td>Agents as tools<\/td><td><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><tr><td>一個穩定的外層流程，裡面巢狀呼叫專家<\/td><td>Agents as tools<\/td><td><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><tr><td>子任務要看輸入才知道有幾個，做完要彙整<\/td><td>Orchestrator-workers（workflow 模式）<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>五、常見錯誤<\/h2>\n<ol><li><strong>Agent 越多越強<\/strong>：太早拆只會多出 prompt、trace 與核准點，不一定變好。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>拆了卻沒想清楚誰負責回覆<\/strong>：這是 multi-agent 的第一個設計決定。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> 沒決定，就分不清該用 handoffs 還是 agents as tools。<\/li><li><strong>專家的工作範圍太寬<\/strong>：每個專家應該只有一個窄的工作，交棒說明要短而具體。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>為了分工而分工<\/strong>：下一個分支如果不需要不同的指令、工具或政策，就不必拆。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>把 orchestrator-workers 當成固定分組<\/strong>：它的子任務由中央 LLM 依輸入動態決定，不是事先定義的。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>拆了之後看不懂發生什麼事<\/strong>：<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> 把追蹤可讀性列為拆分要改善的項目之一；Anthropic 的實作原則也要求透明，明確顯示 Agent 的規劃步驟。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 如果拆完反而看不出是哪一位專家在哪一步出錯，就違背了拆的初衷（本 Wiki 推論）。<\/li><li><strong>以為 handoffs 的進階功能每種語言都一樣<\/strong>：交棒帶 metadata 或過濾歷史的確切 API 依語言而不同，要看 SDK 文件。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ol>\n<h2 class=\"srchead\">本頁來源<\/h2>\n<ul><li><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> Anthropic — Building effective agents（2024-12-19）：<a href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/building-effective-agents<\/a>（存檔 <code>raw/B-anthropic-building-effective-agents.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> OpenAI — Orchestration and handoffs：<a href=\"https://developers.openai.com/api/docs/guides/agents/orchestration\" target=\"_blank\" rel=\"noopener\">https://developers.openai.com/api/docs/guides/agents/orchestration<\/a>（存檔 <code>raw/C-openai-orchestration-and-handoffs.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> LangGraph — Workflows and agents：<a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">https://docs.langchain.com/oss/python/langgraph/workflows-agents<\/a>（存檔 <code>raw/E-langgraph-workflows-and-agents.md<\/code>）<\/li><\/ul>"}, {"id": "04", "title": "04 選型決策：遇到什麼問題，怎麼選", "file": "wiki/workflow-selection/04-選型決策.md", "html": "<h1>04 選型決策：遇到什麼問題，怎麼選<\/h1>\n<blockquote>Job：w10-poc-004（v2，Wiki 增量）｜主張後的 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 對應頁尾來源；標「示意」的是本 Wiki 的教學情境，標「本 Wiki 推論」的是由來源推出、非原文的句子。<\/blockquote>\n<h2>一、定義<\/h2>\n<ul><li><strong>「選型」在這份 Wiki 的意思<\/strong>：面對一個要交給 AI 自動化的任務，決定它該停在複雜度階梯的哪一層：單次 LLM 呼叫、固定自動流、單一 Agent，還是 Multi-Agent（階梯見 00 總覽）。<\/li><li><strong>選型的核心判斷有三個<\/strong>：<ol><li><strong>路徑寫不寫得死<\/strong>：workflow 的路徑是預先寫好的程式；agent 由 LLM 動態決定流程與工具。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>值不值得多花成本<\/strong>：agentic system 常以延遲與成本換取更好的任務表現，要考慮這筆交換何時合理。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>契約有沒有改變<\/strong>：只有下一個分支真的需要不同的指令、工具或政策時才拆成多個 Agent。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ol><\/li><li><strong>選型的總原則<\/strong>：先找最簡單的解法，只在需要時增加複雜度，甚至可能不需要建 agentic system。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 要增加複雜度，必須是能證明結果變好的時候。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<ul><li><strong>選型不是一次定案<\/strong>：這些模式不是規定，而是可以依用途組合與調整的常見模式；同一個系統裡可以同時出現好幾種，成功的關鍵是衡量表現、反覆改進。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 所以選型的答案可以是「主流程用 routing，其中一個分支再交給 agent」這類組合（組合方式為本 Wiki 舉例）。<\/li><\/ul>\n<h2>二、運作方式：一步一步往上問<\/h2>\n<p>把選型想成一串由下往上的問題，前一題答「夠了」就停，不用往上爬：<\/p>\n<ol><li><strong>單次呼叫夠不夠？<\/strong> 很多應用把單次 LLM 呼叫配上檢索與情境內範例優化好，通常就夠了。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> → 夠了就停在這層。<\/li><li><strong>能不能事先拆成固定步驟？<\/strong> 任務能乾淨拆成固定子任務時用 prompt chaining <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；有明確類別、分類能做準時用 routing <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>；子任務可同時跑或需要多次嘗試時用 parallelization <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>；有清楚評估標準、反覆修改有可衡量價值時用 evaluator-optimizer <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>。→ 能拆就停在固定自動流。<\/li><li><strong>子任務要看輸入才知道？<\/strong> 無法預測需要哪些子任務時，用 orchestrator-workers：由中央 LLM 依輸入動態拆解與派工。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>連步驟數都無法預測？<\/strong> 開放式問題、難以或無法預測需要幾步、也無法寫死路徑時，才用 agent；而且要對它的決策有一定信任。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> → 用單一 Agent（工具迴圈），配停止條件與護欄。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>一個 Agent 是否已經不夠清楚？<\/strong> 只有拆開能明顯改善能力隔離、政策隔離、提示清晰度或追蹤可讀性時，才加專家 Agent。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> → 再決定由專家接手（handoffs）還是管理者保有回覆（agents as tools）。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ol>\n<p>每往上一步，都要回頭確認：這一步帶來的好處，是否值得多出的延遲、成本，以及更多的 prompt、trace 與核准點。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/p>\n<h2>三、決策表<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>遇到的情況<\/th><th>建議<\/th><th>依據<\/th><\/tr><\/thead><tbody><tr><td>單次 LLM 呼叫＋檢索＋範例就夠<\/td><td>先不做 agentic system<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><\/tr><tr><td>步驟固定、可事先拆好、要可預測<\/td><td>固定自動流（prompt chaining）<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>輸入有明確類別，分開處理比較好，分類又做得準<\/td><td>Routing<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>子任務彼此獨立可同時跑，或要多種觀點提高信心<\/td><td>Parallelization（sectioning／voting）<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>有清楚評估標準，反覆修改有可衡量的價值<\/td><td>Evaluator-optimizer<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>子任務數量與內容要看輸入才知道<\/td><td>Orchestrator-workers<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>步驟數無法預測、路徑寫不死、需要模型自己判斷<\/td><td>單一 Agent（工具迴圈，ReAct 式）<\/td><td><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/td><\/tr><tr><td>不同部分需要不同指令、工具或政策，且拆開能改善隔離或可讀性<\/td><td>Multi-Agent<\/td><td><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><tr><td>專家應該負責下一個回覆<\/td><td>Handoffs<\/td><td><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><tr><td>管理者要整合最終答案，專家只做摘要、分類等有範圍的工作<\/td><td>Agents as tools<\/td><td><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>四、例子<\/h2>\n<h3 class=\"srchead\">來源裡的例子，放回決策表<\/h3>\n<ul><li><strong>行銷文案→翻譯<\/strong>：步驟固定，屬於 prompt chaining。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>客服問題分成一般問題、退款、技術支援<\/strong>：類別明確，屬於 routing。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> 若要讓專家 Agent 直接接手對話，則是 Triage agent 交棒給 Billing、Refund 專家的 handoffs。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>多個 prompt 一起檢查程式碼漏洞<\/strong>：同一任務多次嘗試，屬於 parallelization 的 voting。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>文學翻譯反覆修稿<\/strong>：有評估者給批評、迴圈改進，屬於 evaluator-optimizer。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>每次要改很多檔案的程式產品<\/strong>：子任務看輸入才知道，屬於 orchestrator-workers。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>解 SWE-bench 任務、操作電腦完成任務<\/strong>：步驟數無法預測，屬於 agent。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>ReAct 在 HotpotQA、Fever 透過 Wikipedia API 查證<\/strong>：推理與行動交錯的 agent 迴圈，減少幻覺與錯誤傳遞。<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><\/li><\/ul>\n<h3>示意：同一個園遊會，四種選擇<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>園遊會的需求<\/th><th>選型<\/th><th>理由對應<\/th><\/tr><\/thead><tbody><tr><td>每天整理報名名單、寄通知<\/td><td>固定自動流<\/td><td>步驟固定可拆 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><\/tr><tr><td>把同學提問分成場地、繳費、其他<\/td><td>Routing<\/td><td>類別明確 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><\/tr><tr><td>想辦法讓攤位不撞名又有人潮<\/td><td>單一 Agent<\/td><td>步驟數無法預測 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/td><\/tr><tr><td>場地、宣傳、財務規則與工具各不同<\/td><td>Multi-Agent<\/td><td>契約不同才拆 <a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>五、適用情境與取捨<\/h2>\n<h3>選型三原則<\/h3>\n<ol><li><strong>由簡入繁<\/strong>：只在能證明結果變好時加複雜度；這些模式可以組合與調整，關鍵是衡量表現並反覆改進。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>Agent 是有代價的<\/strong>：較高成本、錯誤可能累積，需要沙盒測試、護欄與停止條件。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>拆 Agent 要有理由<\/strong>：契約（指令、工具、政策）改變了才拆，否則多出的是 prompt、trace 與核准點。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ol>\n<h3>兩組取捨<\/h3>\n<ul><li><strong>可預測 vs 彈性<\/strong>：任務定義清楚時，workflow 提供可預測性與一致性；需要大規模的彈性與模型自主決策時，agent 是比較好的選擇。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>框架 vs 直接寫<\/strong>：框架讓入門變快，但抽象層可能遮住底層 prompt 與回應、讓除錯變難，也容易誘人加上不必要的複雜度；建議先直接用 LLM API，邁向正式上線時不要猶豫減少抽象層。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<h3>選錯了會怎樣<\/h3>\n<p><strong>選得太簡單<\/strong>（該拆沒拆）：<\/p>\n<ul><li>不同類型的輸入混在同一個流程裡，為某一類輸入最佳化，可能傷害其他類輸入的表現。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>讓同一次 LLM 呼叫同時處理護欄與主要回覆，效果通常不如分給兩個模型實例各做一件事。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>有多個考量的複雜任務擠在一次呼叫裡，不如每個考量各用一次獨立呼叫、專注一個面向。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<p><strong>選得太複雜<\/strong>（不該拆卻拆）：<\/p>\n<ul><li>用 agent 處理其實寫得死的任務，要付出較高成本，並承擔錯誤累積的風險。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>太早拆成多個 Agent，多出 prompt、trace 與核准點，不一定更好。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li>為了套框架而加上的抽象層，會遮住底層的 prompt 與回應，讓除錯更難。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ul>\n<p><strong>本 Wiki 的整理<\/strong>（推論）：太簡單的症狀通常是「某類輸入的品質一直上不去」；太複雜的症狀通常是「成本變高、錯誤難追、要核准的地方變多」。看到哪一種症狀，就往階梯的哪個方向調整一層，再用評估確認有沒有變好（「衡量表現、反覆改進」見 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a>）。<\/p>\n<h3>用一張檢查清單收尾<\/h3>\n<p>選定之前，至少問自己這幾題（每題對應一句來源）：<\/p>\n<ul><li>我能說出這個任務每一步要做什麼嗎？能 → 偏向 workflow。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li>我有沒有辦法驗證每一步的結果？agent 需要每一步從環境取得 ground truth，程式碼 agent 有效的原因之一就是能用自動化測試驗證。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>我有沒有設停止條件與人工檢查點？<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li>如果要拆，我能說出每個專家的指令、工具或政策哪裡不同嗎？<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><\/ul>\n<h2>六、常見錯誤（驗收提醒）<\/h2>\n<ol><li><strong>「固定流程不能用工具或記憶」<\/strong> → 錯。這只是 n8n Basic LLM Chain 節點的產品限制 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>；一般 workflow 的 LLM 可帶工具與記憶 <a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>。<\/li><li><strong>「Agent 越多越強」<\/strong> → 不一定，太早拆反而增加 prompt、trace 與核准點。<a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a><\/li><li><strong>「Agent 比 workflow 先進，所以一律用 Agent」<\/strong> → 錯。很多應用連 agentic system 都不需要；agent 適合的是步驟數無法預測的開放式問題。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><li><strong>「orchestrator-workers 就是平行化」<\/strong> → 不是。平行化的子任務是事先定義的，orchestrator-workers 的子任務依輸入動態決定。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a><\/li><li><strong>「ReAct 讓 Agent 成功率提高 34％」<\/strong> → 不能這樣說。34 與 10 個百分點只是在 ALFWorld 與 WebShop、對上模仿學習與強化學習方法的結果。<a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a><\/li><li><strong>「用了框架就不用懂底層」<\/strong> → 錯。對框架底層的錯誤假設是常見的錯誤來源。<a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a><\/li><\/ol>\n<h2 class=\"srchead\">本頁來源<\/h2>\n<ul><li><a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a> n8n — Agents vs chains：<a href=\"https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains\" target=\"_blank\" rel=\"noopener\">https://docs.n8n.io/build/integrate-ai/understand-ai-components/agents-vs-chains<\/a>（存檔 <code>raw/A-n8n-agents-vs-chains.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"B\">[B]<\/a> Anthropic — Building effective agents（2024-12-19）：<a href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/building-effective-agents<\/a>（存檔 <code>raw/B-anthropic-building-effective-agents.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"C\">[C]<\/a> OpenAI — Orchestration and handoffs：<a href=\"https://developers.openai.com/api/docs/guides/agents/orchestration\" target=\"_blank\" rel=\"noopener\">https://developers.openai.com/api/docs/guides/agents/orchestration<\/a>（存檔 <code>raw/C-openai-orchestration-and-handoffs.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"D\">[D]<\/a> Yao et al. — ReAct: Synergizing Reasoning and Acting in Language Models（arXiv:2210.03629，v3 2023-03-10，引用摘要頁）：<a href=\"https://arxiv.org/abs/2210.03629\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2210.03629<\/a>（存檔 <code>raw/D-react-arxiv-2210.03629.md<\/code>）<\/li><li><a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> LangGraph — Workflows and agents：<a href=\"https://docs.langchain.com/oss/python/langgraph/workflows-agents\" target=\"_blank\" rel=\"noopener\">https://docs.langchain.com/oss/python/langgraph/workflows-agents<\/a>（存檔 <code>raw/E-langgraph-workflows-and-agents.md<\/code>）<\/li><\/ul>"}, {"id": "about", "title": "關於這個 Wiki", "file": "wiki/README.md", "html": "<h1>LLM-Wiki — 知識庫（<code>wiki/<\/code>）<\/h1>\n<blockquote>這裡是 LLM-Wiki 的家：底層事實，按選型問題分章，不是按來源堆。Wiki 是單一事實來源，錯了後面全錯，所以不趕工。<\/blockquote>\n<h2>內容怎麼來<\/h2>\n<ol><li><strong>Ingest（Cue，@cue）<\/strong>：依 <code>topics/topic.yaml<\/code> 找 5 篇以上官方／技術文件，HTTP 200、內文非空、去重、官方優先。<\/li><li><strong>結構化進 Wiki（Hark）<\/strong>：把文件整理進本目錄的分章 Markdown，每個主張標來源。<\/li><li><strong>驗證（Instinct）<\/strong>：每個主張都有來源、沒有腦補、重點都有覆蓋、結構完整、來源之間沒有矛盾。不合格退回 ingest 補抓。<\/li><\/ol>\n<h2>佈局<\/h2>\n<pre><code>wiki/\n  README.md                 本檔\n  &lt;topic-slug&gt;/             一個主題一個資料夾\n    00-總覽.md\n    01-固定自動流.md\n    02-單一-agent.md\n    03-multi-agent.md\n    04-選型決策.md<\/code><\/pre>\n<ul><li>每個主張標來源（<code>來源：&lt;文件標題&gt;（URL）<\/code>）。<\/li><li>同一個 Wiki 可以生三種教案（國小／國中／高中），但每種都要單獨驗。<\/li><li>Wiki 越用越厚，同主題第二次不用再 ingest。<\/li><\/ul>\n<h2>目前狀態<\/h2>\n<ul><li><code>workflow-selection/<\/code>：範例主題（固定自動流 → 單一 Agent → Multi-Agent 選型）5 頁已建立，來源 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a> 為 Cue stage_1_ingest 五篇（Instinct PASS）；stage_2_wiki 內容經 Instinct 驗收 PASS（Job w10-poc-001）。每頁頁尾附「本頁來源」標題與 URL。<\/li><li><strong>v2（Job w10-poc-004，Wiki 增量）<\/strong>：5 頁加深，每頁正文（不含頁尾來源清單）≥ 2,000 個中文字，且都有「定義、運作方式、例子、適用情境與取捨、常見錯誤」五段；新增內容只用 <a class=\"tag\" href=\"#\" data-src=\"A\">[A]<\/a>–<a class=\"tag\" href=\"#\" data-src=\"E\">[E]<\/a>（原文存檔見 <code>raw/<\/code>），教學情境標「示意」、由來源推出的句子標「本 Wiki 推論」。v1 留在 git history 作反思材料。<\/li><li>Google 官方來源仍從缺（<code>topics/topic.yaml<\/code> TODO），目前五篇已達門檻。<\/li><li>檔案命名與分章細節以 <code>agents/wiki.md<\/code> 為準。<\/li><\/ul>"}]}</script>
<script>
(function(){
  const W = JSON.parse(document.getElementById('wiki-data').textContent);
  const P = W.pages, wikiPages = P.filter(p => p.id !== 'about');
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const short = t => t.replace(/^\d\d\s*/, '').replace(/[（(].*$/, '').split('：')[0];
  $('foot-path').textContent = 'wiki/' + W.slug + '/';

  // 從各頁「來源」清單收集 [A]–[E] 標題，做 tag 的滑鼠提示
  const SRC = {};
  const tmp = document.createElement('div');
  P.forEach(p => { tmp.innerHTML = p.html; tmp.querySelectorAll('h2.srchead + ul > li').forEach(li => {
    const m = li.textContent.match(/^\[([A-E])\]\s*(.*?)：\s*https?:/); if (m && !SRC[m[1]]) SRC[m[1]] = m[2]; }); });

  $('nav').innerHTML = wikiPages.map(p => `<a href="#${p.id}" data-id="${p.id}"><span class="n">${p.id}</span><span>${esc(short(p.title))}</span></a>`).join('')
    + '<div class="sep"></div>' + P.filter(p => p.id === 'about').map(p => `<a href="#about" data-id="about"><span class="n">ⓘ</span><span>${esc(p.title)}</span></a>`).join('');

  function show(id){
    const i = P.findIndex(p => p.id === id); const p = P[i >= 0 ? i : 0];
    const doc = $('doc'); doc.innerHTML = p.html;
    if (p.id === 'about' && !doc.querySelector('h1')) doc.insertAdjacentHTML('afterbegin', `<h1>${esc(p.title)}</h1>`);
    doc.querySelectorAll('h2.srchead + ul > li').forEach(li => { const m = li.textContent.match(/^\[([A-E])\]/); if (m) li.id = 'src-' + m[1]; });
    doc.querySelectorAll('a.tag').forEach(a => { const k = a.dataset.src; if (SRC[k]) a.title = '[' + k + '] ' + SRC[k]; });
    $('crumb').innerHTML = `LLM-Wiki ／ <a href="${W.repo}${p.file}" target="_blank" rel="noopener">${esc(p.file)}</a>`;
    document.title = p.title + '｜LLM-Wiki';
    const seq = wikiPages, k = seq.indexOf(p);
    const prev = k > 0 ? seq[k-1] : null, next = k >= 0 && k < seq.length - 1 ? seq[k+1] : (k < 0 ? seq[0] : null);
    $('pager').innerHTML = (prev ? `<a href="#${prev.id}"><small>← 上一頁</small>${esc(prev.title)}</a>` : '')
      + (next ? `<a class="next" href="#${next.id}"><small>下一頁 →</small>${esc(next.title)}</a>` : '');
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
    $('side').classList.remove('open');
    window.scrollTo(0, 0);
  }
  // tag 點擊：跳到本頁來源；本頁沒列就跳 00 總覽的來源清單
  document.addEventListener('click', e => {
    const a = e.target.closest('a.tag'); if (!a) return; e.preventDefault();
    let li = document.getElementById('src-' + a.dataset.src);
    if (!li) { location.hash = '00'; setTimeout(() => flash(document.getElementById('src-' + a.dataset.src)), 30); return; }
    flash(li);
  });
  function flash(li){ if (!li) return; li.scrollIntoView({block:'center'}); li.classList.add('hit'); setTimeout(() => li.classList.remove('hit'), 1600); }
  $('menu').addEventListener('click', () => $('side').classList.toggle('open'));
  const route = () => show((location.hash || '#00').slice(1));
  addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>
